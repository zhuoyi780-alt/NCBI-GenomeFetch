name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q taxonomy_downloader

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build source and wheel distributions
        run: pyproject-build --no-isolation

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          blocked = ("datasets.exe", "__pycache__", "examples/split_example")
          bad_entries = []
          for artifact in pathlib.Path("dist").iterdir():
              if artifact.name.endswith(".tar.gz"):
                  entries = tarfile.open(artifact).getnames()
              elif artifact.suffix == ".whl":
                  entries = zipfile.ZipFile(artifact).namelist()
              else:
                  continue

              for entry in entries:
                  if any(blocked_name in entry for blocked_name in blocked):
                      bad_entries.append((artifact.name, entry))

          if bad_entries:
              raise SystemExit(f"Blocked files found in distributions: {bad_entries}")
          PY
